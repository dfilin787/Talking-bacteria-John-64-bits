name: TalkingJohn
options:
  bundleIdPrefix: com.pokoyo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  TalkingJohn:
    type: application
    platform: iOS
    sources:
      - path: TalkingJohn/Sources
      - path: TalkingJohn/Support
      - path: Vendor/SoundTouch
        excludes:
          - "LICENSE.TXT"
          - "README.html"
          - "Makefile.am"
          - "CMakeLists.txt"
      - path: Assets/Animations
        type: folder
      - path: Assets/Sounds
        type: folder
      - path: Assets/UI
        type: folder
      - path: TalkingJohn/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokoyo.talkingjohn
        INFOPLIST_FILE: TalkingJohn/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: TalkingJohn/Support/TalkingJohn-Bridging-Header.h
        SWIFT_OBJC_INTERFACE_HEADER_NAME: TalkingJohn-Swift.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        GCC_C_LANGUAGE_STANDARD: gnu11
        GCC_ENABLE_CPP_EXCEPTIONS: NO
        GCC_ENABLE_OBJC_EXCEPTIONS: NO
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/SoundTouch
          - $(SRCROOT)/TalkingJohn/Support
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - ST_NO_EXCEPTION_HANDLING=1
        SWIFT_ACTIVE_COMPILATION_CONDITIONS:
          - $(inherited)
        WARNING_CFLAGS:
          - -Wno-shorten-64-to-32
          - -Wno-unused-parameter
        ENABLE_TESTABILITY: YES