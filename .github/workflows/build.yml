name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      signed:
        description: "Подписать сертификатом из секретов (иначе unsigned IPA)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка arm64
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode и SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "Доступные симуляторы:"
          xcrun simctl list devices available | head -20

      - name: Проверки проекта (без Xcode)
        run: python3 tools/check_all.py

      - name: Установка XcodeGen
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.48.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          # Каталог ставим целиком: бинарник ищет SettingPresets относительно себя,
          # голый симлинк на исполняемый файл их не найдёт.
          sudo mkdir -p /opt
          sudo cp -R /tmp/xcodegen-dist/xcodegen /opt/xcodegen
          sudo chmod +x /opt/xcodegen/bin/xcodegen
          echo "/opt/xcodegen/bin" >> "$GITHUB_PATH"
          /opt/xcodegen/bin/xcodegen --version

      - name: Генерация проекта
        run: xcodegen generate

      - name: Сборка для устройства (без подписи)
        run: |
          set -o pipefail
          xcodebuild \
            -project TalkingJohn.xcodeproj \
            -scheme TalkingJohn \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build | tee xcodebuild.log

      - name: Проверка архитектуры бинарника
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "Не найден .app"; exit 1; fi
          echo "Бандл: $APP"
          BIN="$APP/$(basename "$APP" .app)"
          lipo -info "$BIN"
          if ! lipo -info "$BIN" | grep -q arm64; then
            echo "ОШИБКА: в бинарнике нет arm64"; exit 1
          fi
          if lipo -info "$BIN" | grep -Eq 'armv7|i386'; then
            echo "ОШИБКА: остались 32-битные слайсы"; exit 1
          fi
          echo "Ассеты в бандле:"
          ANIM_DIR=$(find "$APP" -type d -name Animations | head -1)
          SOUND_DIR=$(find "$APP" -type d -name Sounds | head -1)
          UI_DIR=$(find "$APP" -type d -name UI | head -1)
          if [ -z "$ANIM_DIR" ] || [ -z "$SOUND_DIR" ]; then
            echo "ОШИБКА: папки Animations/Sounds не попали в бандл"; find "$APP" -maxdepth 2 | head -30; exit 1
          fi
          echo "  Animations: $ANIM_DIR (клипов: $(ls "$ANIM_DIR" | wc -l))"
          echo "  Sounds: $SOUND_DIR (wav: $(ls "$SOUND_DIR" | wc -l))"
          [ -n "$UI_DIR" ] && echo "  UI: $(ls "$UI_DIR" | wc -l) файлов"
          test -d "$ANIM_DIR/talk" || { echo "нет клипа talk"; exit 1; }
          test -f "$SOUND_DIR/laugh.wav" || { echo "нет laugh.wav"; exit 1; }
          echo "кадров в talk: $(ls "$ANIM_DIR/talk" | wc -l)"

      - name: Упаковка unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p Payload out
          cp -R "$APP" Payload/
          zip -qry out/TalkingJohn-unsigned.ipa Payload
          ls -lh out/
          echo "Unsigned IPA ставится через Sideloadly / AltStore / TrollStore."

      - name: Импорт сертификата
        if: ${{ github.event.inputs.signed == 'true' }}
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ci-temporary
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ] || [ -z "$PROVISION_BASE64" ]; then
            echo "Секреты IOS_P12_BASE64 / IOS_PROVISION_BASE64 не заданы"; exit 1
          fi
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$PROVISION_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Сборка с подписью
        if: ${{ github.event.inputs.signed == 'true' }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project TalkingJohn.xcodeproj \
            -scheme TalkingJohn \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-signed \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            clean build | tee xcodebuild-signed.log

          APP=$(find build-signed/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "Не найден подписанный .app"; exit 1; fi
          codesign -dv --verbose=2 "$APP"
          mkdir -p out
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry out/TalkingJohn-signed.ipa Payload
          ls -lh out/

      - name: Уборка ключницы
        if: ${{ always() && github.event.inputs.signed == 'true' }}
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

      - name: Артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TalkingJohn-build
          path: |
            out/*.ipa
            xcodebuild*.log
          if-no-files-found: warn
          retention-days: 14